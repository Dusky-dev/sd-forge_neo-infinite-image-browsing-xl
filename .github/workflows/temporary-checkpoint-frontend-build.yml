name: Build checkpoint-filter UI assets (temporary)

on:
  push:
    branches:
      - feat/try-my-luck-checkpoint-filter-20261107

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install frontend dependencies
        working-directory: vue
        run: yarn install --frozen-lockfile
      - name: Type-check and build Vite assets
        working-directory: vue
        run: yarn build
      - name: Preserve checked-in browser assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f vue/dist javascript/index.js
          if ! git diff --cached --quiet; then
            git commit -m "Build checkpoint-filter frontend assets"
            git push origin HEAD:feat/try-my-luck-checkpoint-filter-20261107
          fi
