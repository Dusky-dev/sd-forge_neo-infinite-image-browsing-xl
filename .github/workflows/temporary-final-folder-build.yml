name: Final build for atomic folder navigation fix (temporary)

on:
  push:
    branches:
      - fix/first-click-folder-render-20261107

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install frontend dependencies
        working-directory: vue
        run: yarn install --frozen-lockfile
      - name: Typecheck and compile production frontend
        working-directory: vue
        run: yarn build
      - name: Commit deployed browser assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f vue/dist javascript/index.js
          if ! git diff --cached --quiet; then
            git commit -m "Rebuild frontend for atomic folder navigation fix"
            git push origin HEAD:fix/first-click-folder-render-20261107
          fi
