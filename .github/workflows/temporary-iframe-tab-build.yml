name: Temporary Forge tab-return frontend rebuild

on:
  push:
    branches:
      - fix/forge-tab-return-blank-grid-20261109

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        working-directory: vue
        run: yarn install --frozen-lockfile
      - name: Test tab returns and folder navigation
        working-directory: vue
        run: yarn test
      - name: Build production frontend (type check + Vite)
        working-directory: vue
        run: yarn build
      - name: Commit rebuilt frontend assets onto PR branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add vue/dist javascript/index.js
          if ! git diff --cached --quiet; then
            git commit -m "build: regenerate IIB frontend for Gradio tab return"
            git push origin HEAD:fix/forge-tab-return-blank-grid-20261109
          fi
