name: vue_tests

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check-out repository
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install frontend dependencies
        run: yarn install --frozen-lockfile
        working-directory: vue

      - name: Run frontend tests
        run: yarn test
        working-directory: vue

  random-checkpoint:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install metadata parsing dependencies
        run: python -m pip install pillow piexif requests

      - name: Test checkpoint-filtered random browsing
        run: python -m unittest discover -s tests -p 'test_random_checkpoint.py' -v
